# nginx Reverse Proxy für netprobe.
# Uvicorn/Gunicorn lauscht nur auf 127.0.0.1:8000; nginx ist im LAN erreichbar.

upstream netprobe_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTPS siehe zweiter server-Block (Port 443).

    client_max_body_size 8m;

    # Server-Sent Events benötigen deaktiviertes Buffering.
    location /api/ping/stream {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;
    }

    location / {
        proxy_pass http://netprobe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS (Port 443) ---
# Schlüssel/Zertifikat legt install.sh (setup_tls) unter /etc/netprobe/tls/ an:
# selbstsigniert, Schlüssel bleibt bei Erneuerung gleich. Wachtl-Probes prüfen den
# SPKI-Pin dieses Schlüssels (/api/probe/v1). Eigenes Zertifikat: Dateien ersetzen –
# ein neuer Schlüssel ändert den Pin, alle Probes müssen dann neu registriert werden.
# Port 80 bleibt für die Weboberfläche aktiv; Umleitung auf HTTPS nach Bedarf ergänzen.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/netprobe/tls/fullchain.pem;
    ssl_certificate_key /etc/netprobe/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 8m;

    location /api/ping/stream {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;
    }

    location / {
        proxy_pass http://netprobe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
