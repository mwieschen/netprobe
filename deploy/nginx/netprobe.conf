# nginx Reverse Proxy für netprobe.
# Uvicorn/Gunicorn lauscht nur auf 127.0.0.1:8000; nginx ist im LAN erreichbar.

upstream netprobe_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Für produktiven Betrieb HTTPS bevorzugen (siehe TLS-Block unten) und
    # HTTP dann auf HTTPS umleiten.

    client_max_body_size 8m;

    # Server-Sent Events benötigen deaktiviertes Buffering.
    location /api/ping/stream {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://netprobe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;
    }

    location / {
        proxy_pass http://netprobe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

