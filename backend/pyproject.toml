[project]
name = "netprobe"
version = "1.0.0"
description = "Lokale Web-Appliance für Netzwerk- und WAN-Monitoring"
# Kein 'readme' hier: Die README liegt im Repo-Wurzelverzeichnis (außerhalb von
# backend/) und neuere setuptools verbieten Pfade außerhalb des Paketverzeichnisses.
# Das Paket wird ohnehin nicht auf PyPI veröffentlicht.
# Läuft auf Python 3.12–3.14 (Ubuntu 22.04/24.04 → 3.12, 26.04 → 3.14).
requires-python = ">=3.12"
license = { text = "MIT" }
# Mindestversionen so gewählt, dass für Python 3.14 vorgebaute Wheels existieren
# (pydantic-core, SQLAlchemy-C-Extensions, argon2-cffi). Der Installer richtet
# zusätzlich build-essential + python3-dev ein, damit Quell-Builds als Rückfall möglich sind.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.14",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]
# Optionale PDF-Ausgabe für Reports. Benötigt zusätzlich Pango-Systembibliotheken
# (libpango-1.0-0, libpangoft2-1.0-0). Ohne dieses Extra werden Reports nur als
# HTML erzeugt.
pdf = [
    "weasyprint>=60",
]

[project.scripts]
netprobe = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() im Default-Argument ist gewollt

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
